# ORPHANED (Spectro fork): referenced by NO kustomization on this branch — not part of
# any `kustomize build` output, on this branch or on pre-upgrade spectro-master. Kept
# for historical reference only. The deployable equivalent (where still relevant) lives
# in palette config/vendorcrd/azure/ (palette-extras.yaml / global kustomization
# patches). Do not extend — new fork-only manifest changes go in config/spectro/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
          - name: AZURE_SUBSCRIPTION_ID
            valueFrom:
              secretKeyRef:
                name: manager-bootstrap-credentials
                key: subscription-id
          - name: AZURE_TENANT_ID
            valueFrom:
              secretKeyRef:
                name: manager-bootstrap-credentials
                key: tenant-id
          - name: AZURE_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: manager-bootstrap-credentials
                key: client-id
          - name: AZURE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: manager-bootstrap-credentials
                key: client-secret
