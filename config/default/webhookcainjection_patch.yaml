# ORPHANED (Spectro fork): referenced by NO kustomization on this branch — not part of
# any `kustomize build` output, on this branch or on pre-upgrade spectro-master. Kept
# for historical reference only. The deployable equivalent (where still relevant) lives
# in palette config/vendorcrd/azure/ (palette-extras.yaml / global kustomization
# patches). Do not extend — new fork-only manifest changes go in config/spectro/.

# This patch add annotation to admission webhook config and
# the variables CERTIFICATE_NAMESPACE_PLACEHOLDER and CERTIFICATE_NAME_PLACEHOLDER will be substituted by kustomize.
# uncomment the following lines to enable mutating and validating webhook
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: CERTIFICATE_NAMESPACE_PLACEHOLDER/CERTIFICATE_NAME_PLACEHOLDER
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: CERTIFICATE_NAMESPACE_PLACEHOLDER/CERTIFICATE_NAME_PLACEHOLDER