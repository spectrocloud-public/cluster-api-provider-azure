# Canonical fork-only CAPZ CRD schema delta vs upstream v1.26.0 (JSON6902, kustomize
# `patches:` format). 4 CRDs, 19 ops — purely additive. THIS file (config/spectro/) is
# the source of truth for the fork CRD delta.
#
# NOT applied by config/spectro/kustomization.yaml: the fork's config/crd/bases are
# GENERATED from the fork's Go types and already carry these fields. This file is the
# canonical, reviewable encoding of that delta, and the sync source for palette:
# config/vendorcrd/azure/crd-patch.yaml MUST stay identical (palette's vendorcrd-sync
# layers it onto the UPSTREAM CRDs at sync time — the fork ships no release manifest).
# (spectro/vendorcrd/crd-patch.yaml is a historical artifact of the same content; it is
# not maintained going forward.)
#
# Regenerate/validate after each upstream bump from `git diff <upstream-tag> -- config/crd/bases`:
# applying this patch to the upstream CRDs must reproduce the fork's generated CRDs
# (see README.md Verification).
#
# JSON6902 (not strategic-merge): the additions live under spec.versions[] (a list with
# a name merge-key kustomize SMP can't merge) and include enum appends (role: all) which
# SMP would replace wholesale. All target the sole served version, versions[0] (v1beta1).
patches:
- target:
    kind: CustomResourceDefinition
    name: azureclusters.infrastructure.cluster.x-k8s.io
  patch: |
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/networkSpec/properties/apiServerLB/properties/ipAllocationMethod
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/networkSpec/properties/apiServerLB/properties/privateIP
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/networkSpec/properties/controlPlaneOutboundLB/properties/ipAllocationMethod
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/networkSpec/properties/controlPlaneOutboundLB/properties/privateIP
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/networkSpec/properties/nodeOutboundLB/properties/ipAllocationMethod
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/networkSpec/properties/nodeOutboundLB/properties/privateIP
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/networkSpec/properties/subnets/items/properties/role/enum/-
      value: all
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/bastionSpec/properties/azureBastion/properties/subnet/properties/role/enum/-
      value: all
- target:
    kind: CustomResourceDefinition
    name: azureclustertemplates.infrastructure.cluster.x-k8s.io
  patch: |
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/networkSpec/properties/apiServerLB/properties/ipAllocationMethod
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/networkSpec/properties/apiServerLB/properties/privateIP
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/networkSpec/properties/controlPlaneOutboundLB/properties/ipAllocationMethod
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/networkSpec/properties/controlPlaneOutboundLB/properties/privateIP
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/networkSpec/properties/nodeOutboundLB/properties/ipAllocationMethod
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/networkSpec/properties/nodeOutboundLB/properties/privateIP
      value: {type: string}
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/networkSpec/properties/subnets/items/properties/role/enum/-
      value: all
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/bastionSpec/properties/azureBastion/properties/subnet/properties/role/enum/-
      value: all
- target:
    kind: CustomResourceDefinition
    name: azuremanagedcontrolplanes.infrastructure.cluster.x-k8s.io
  patch: |
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/aadProfile/properties/enableAzureRBAC
      value:
        description: EnableAzureRBAC - Whether to enable Azure RBAC for Kubernetes authorization.
        type: boolean
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/fqdnSubdomain
      value:
        description: FqdnSubdomain - FQDN subdomain specified when creating private cluster with custom private dns zone.
        type: string
- target:
    kind: CustomResourceDefinition
    name: azuremanagedcontrolplanetemplates.infrastructure.cluster.x-k8s.io
  patch: |
    - op: add
      path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/template/properties/spec/properties/aadProfile/properties/enableAzureRBAC
      value:
        description: EnableAzureRBAC - Whether to enable Azure RBAC for Kubernetes authorization.
        type: boolean
